<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Affen-Abwehr</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9f2d8;--panel:#fff8e1;--ink:#2b2a1c;--acc:#f2b705;--line:#c9b87a;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17261c;--panel:#24382a;--ink:#f3efd3;--line:#4b6a52}}
:root[data-theme="dark"]{--bg:#17261c;--panel:#24382a;--ink:#f3efd3;--line:#4b6a52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.4 Fredoka,system-ui,sans-serif}
.wrap{display:flex;flex-wrap:wrap;gap:12px;padding:12px;max-width:1150px;margin:0 auto}
.main{flex:1 1 560px;min-width:0}.side{flex:1 1 280px;max-width:100%}
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.hud span{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:3px 14px;font-weight:600}
.hud button{margin-left:auto}
.cv{position:relative}
canvas{width:100%;height:auto;display:block;border:3px solid var(--line);border-radius:14px;touch-action:manipulation;background:#6fae52}
.box{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.box h3{margin:0 0 6px;font-size:16px}
button{font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.on{background:var(--acc);border-color:var(--acc);color:#2b2a1c}
#go{width:100%;background:var(--acc);border-color:var(--acc);color:#2b2a1c;font-weight:600;font-size:17px;padding:10px}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.shop button,.pan button{display:flex;justify-content:space-between;gap:6px;text-align:left}
.pan button{width:100%;margin-top:5px}
.hint{font-size:13px;opacity:.8;margin:6px 0 0}
#ov{position:absolute;inset:0;display:none;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:rgba(20,35,25,.78);border-radius:12px;color:#fff;text-align:center;padding:16px}
#ov h2{margin:0;font-size:30px}
</style></head>
<body>
<div class="wrap">
 <div class="main">
  <div class="hud"><span id="hl">❤️ 100</span><span id="hm">💰 650</span><span id="hr">Runde 1 / 40</span><button id="sp">Tempo ×1</button></div>
  <div class="cv"><canvas id="c" width="800" height="500"></canvas>
   <div id="ov"><h2 id="ot"></h2><p id="od"></p><button id="ob"></button></div></div>
 </div>
 <div class="side">
  <button id="go">Runde starten</button>
  <div class="box" style="margin-top:10px"><h3>Affen kaufen</h3><div class="shop" id="shop"></div>
   <p class="hint">Wähle einen Affen und klicke aufs Feld. Esc bricht ab. Bleiballons sind immun gegen Pfeile und Stacheln, Tarnballons brauchen Tarnsicht.</p></div>
  <div class="box pan" id="pan"><h3>Auswahl</h3><p class="hint">Klicke einen Affen auf dem Feld, um ihn aufzuwerten.</p></div>
  <div class="box"><button id="ab" style="width:100%">Pfeilsturm (Held)</button></div>
 </div>
</div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d');
// ---- Pfad & Karte
const P=[[-20,80],[620,80],[620,200],[140,200],[140,320],[660,320],[660,440],[300,440],[300,520]];
const seg=[];let L=0;
for(let i=0;i<P.length-1;i++){const a=P[i],b=P[i+1],l=Math.hypot(b[0]-a[0],b[1]-a[1]);seg.push({a,b,l,s:L});L+=l}
function at(d){for(const g of seg)if(d<=g.s+g.l){const t=(d-g.s)/g.l;return[g.a[0]+(g.b[0]-g.a[0])*t,g.a[1]+(g.b[1]-g.a[1])*t]}return P[P.length-1]}
function pd(px,py){let m=1e9;for(const g of seg){const dx=g.b[0]-g.a[0],dy=g.b[1]-g.a[1],t=Math.max(0,Math.min(1,((px-g.a[0])*dx+(py-g.a[1])*dy)/(g.l*g.l)));m=Math.min(m,Math.hypot(px-g.a[0]-dx*t,py-g.a[1]-dy*t))}return m}
const ROCKS=[[400,140,24],[80,120,22],[720,230,24],[420,380,26],[100,440,24]];
// ---- Bloons
const T={red:{c:'#e23b3b',s:1.1,k:[]},blue:{c:'#3b8be2',s:1.4,k:['red']},green:{c:'#3dbb4a',s:1.8,k:['blue']},
 yellow:{c:'#f0cf2a',s:2.5,k:['green']},pink:{c:'#f57bb5',s:2.9,k:['yellow']},
 lead:{c:'#8a8f9c',s:1,k:['green','green'],lead:1},
 moab:{c:'#2f6fc4',s:.8,k:['pink','pink','pink','pink'],hp:60}};
const rank=t=>T[t].k.reduce((a,k)=>a+rank(k),1);
// ---- Affen
const D={
 dart:{n:'Dartaffe',e:'🐵',c:200,r:95,rate:42,dmg:1,kind:'sharp',shots:1,col:'#c8863a',up:[['Turbo-Pfeile',140,t=>t.rate*=.6],['Adlerauge (Tarnsicht)',220,t=>{t.r+=30;t.camo=1}],['Dreifach-Pfeile',380,t=>{t.shots=3;t.dmg=2}]]},
 bomb:{n:'Bombenaffe',e:'🦍',c:450,r:105,rate:95,dmg:1,kind:'boom',splash:42,col:'#555',up:[['Größere Bomben',250,t=>t.splash+=22],['Schnellzünder',350,t=>t.rate*=.6],['Mega-Bombe',700,t=>{t.dmg=3;t.splash+=15}]]},
 ice:{n:'Eisaffe',e:'🐒',c:300,r:75,rate:70,dmg:0,kind:'frost',col:'#5bb8e8',up:[['Eiskristalle',200,t=>t.dmg=1],['Weite Kälte (Tarnsicht)',250,t=>{t.r+=30;t.camo=1}],['Permafrost',500,t=>{t.rate*=.6;t.dmg=2}]]},
 snip:{n:'Scharfschütze',e:'🙉',c:380,r:9999,rate:110,dmg:2,kind:'sharp',col:'#3a6b3a',up:[['Schneller Repetierer',250,t=>t.rate*=.55],['Hohlspitze',400,t=>t.dmg=5],['Wärmebild (Tarnsicht)',600,t=>{t.camo=1;t.dmg=9}]]},
 hero:{n:'Held Quincy',e:'🦧',c:500,r:110,rate:30,dmg:1,kind:'sharp',shots:3,camo:1,col:'#d4a017',up:[]},
 trap:{n:'Stachelfalle',e:'📌',c:50}};
// ---- Zustand
let B,TW,TR,FX,q,money,lives,round,frame,running,over,won,spd=1,pl=null,sel=null,mx=0,my=0,abCd=0;
const WIN=40;
function reset(){B=[];TW=[];TR=[];FX=[];q=[];money=650;lives=100;round=1;frame=0;running=false;over=false;won=false;sel=null;pl=null;abCd=0;$('ov').style.display='none'}
function spawn(t,d,camo){const p=at(d);B.push({t,d,camo:!!camo,hp:T[t].hp||1,lead:!!T[t].lead,slow:0,x:p[0],y:p[1]})}
function hit(b,dmg,kind){
 if(b.dead||(b.lead&&kind=='sharp'))return false;
 if(b.hp>1){b.hp-=dmg;money++;if(b.hp>0)return true;money+=20;dmg=1}
 let t=b.t,n=dmg;
 while(n>0){money++;const k=T[t].k;n--;
  if(!k.length){b.dead=1;return true}
  if(k.length>1||n==0){b.dead=1;k.forEach((c,i)=>spawn(c,b.d-i*5,b.camo));return true}
  t=k[0]}
 return true}
function plan(n){const g=[],add=(ty,c,gap,camo)=>{c=Math.floor(c);if(c>0)g.push({ty,c,gap,camo})};
 if(n<9)add('red',6+n*2,22);if(n>=2&&n<16)add('blue',3+n,24);if(n>=5)add('green',n-2,22);
 if(n>=9)add('yellow',(n-6)*.8,20);if(n>=14)add('pink',(n-12)*.9,18);if(n>=12)add('lead',(n-10)/2,40);
 if(n>=8)add('green',n/2,26,1);if(n>=18)add('yellow',(n-16)/2,24,1);if(n%10==0)add('moab',n/10,120);return g}
function startRound(){if(running||over)return;running=true;
 plan(round).forEach((g,gi)=>{for(let i=0;i<g.c;i++)q.push({t:frame+10+gi*7+i*g.gap,ty:g.ty,camo:g.camo})});
 q.sort((a,b)=>a.t-b.t)}
const heroLv=()=>Math.min(20,1+Math.floor(round/2));
function tick(){
 frame++;abCd>0&&abCd--;
 while(q.length&&q[0].t<=frame){const s=q.shift();spawn(s.ty,0,s.camo)}
 for(const b of B){if(b.dead)continue;b.d+=T[b.t].s*(b.slow>0?.5:1);b.slow>0&&b.slow--;const p=at(b.d);b.x=p[0];b.y=p[1];
  if(b.d>=L){b.dead=1;lives-=rank(b.t)}}
 for(const tr of TR){if(tr.cd>0){tr.cd--;continue}
  for(const b of B)if(!b.dead&&Math.hypot(b.x-tr.x,b.y-tr.y)<18&&hit(b,1,'sharp')){tr.n--;tr.cd=8;break}}
 TR=TR.filter(t=>t.n>0);
 for(const t of TW){
  let rate=t.rate,dmg=t.dmg;
  if(t.k=='hero'){const l=heroLv();rate*=Math.pow(.96,l);dmg+=Math.floor(l/6);t.lv=l}
  if(t.cd>0){t.cd--;continue}
  const c=B.filter(b=>!b.dead&&(!b.camo||t.camo)&&Math.hypot(b.x-t.x,b.y-t.y)<=t.r&&!(t.kind=='sharp'&&b.lead));
  if(!c.length)continue;c.sort((a,b)=>b.d-a.d);t.cd=rate;
  if(t.kind=='frost'){c.forEach(b=>{b.slow=90;if(dmg)hit(b,dmg,'frost')});FX.push({ring:1,x:t.x,y:t.y,r:t.r,l:12,col:'#9be'})}
  else if(t.kind=='boom'){const g=c[0];B.filter(b=>Math.hypot(b.x-g.x,b.y-g.y)<=t.splash).forEach(b=>hit(b,dmg,'boom'));FX.push({ring:1,x:g.x,y:g.y,r:t.splash,l:10,col:'#fa3'})}
  else for(let i=0;i<t.shots&&i<c.length;i++){hit(c[i],dmg,'sharp');FX.push({x1:t.x,y1:t.y,x2:c[i].x,y2:c[i].y,l:5})}}
 B=B.filter(b=>!b.dead);FX.forEach(f=>f.l--);FX=FX.filter(f=>f.l>0);
 if(lives<=0){lives=0;end('Die Bloons sind durch!','Du hast Runde '+round+' erreicht.','Neues Spiel')}
 else if(running&&!q.length&&!B.length){running=false;money+=90+3*round;round++;
  if(round>WIN&&!won){won=true;end('Alle Bloons geplatzt!','Du hast '+WIN+' Runden geschafft. Im Freeplay geht es weiter.','Freeplay starten',1)}}}
function end(t,d,b,cont){over=!cont;$('ot').textContent=t;$('od').textContent=d;$('ob').textContent=b;$('ob').onclick=()=>{cont?$('ov').style.display='none':reset()};$('ov').style.display='flex'}
// ---- Zeichnen
function draw(){
 x.fillStyle='#6fae52';x.fillRect(0,0,800,500);
 x.lineJoin=x.lineCap='round';x.beginPath();P.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));
 x.strokeStyle='#b89c55';x.lineWidth=46;x.stroke();x.strokeStyle='#e8d595';x.lineWidth=38;x.stroke();
 ROCKS.forEach(r=>{x.fillStyle='#8c9094';x.beginPath();x.arc(r[0],r[1],r[2],0,7);x.fill();x.fillStyle='#a9adb1';x.beginPath();x.arc(r[0]-6,r[1]-7,r[2]*.5,0,7);x.fill()});
 TR.forEach(t=>{x.font='18px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('📌',t.x,t.y)});
 const show=sel||(pl&&pl!='trap'?{x:mx,y:my,r:D[pl].r<999?D[pl].r:0}:null);
 if(show&&show.r){x.fillStyle='rgba(255,255,255,.22)';x.beginPath();x.arc(show.x,show.y,Math.min(show.r,700),0,7);x.fill()}
 x.font='24px serif';x.textAlign='center';x.textBaseline='middle';
 TW.forEach(t=>{x.fillStyle=t.col;x.beginPath();x.arc(t.x,t.y,19,0,7);x.fill();x.lineWidth=3;x.strokeStyle=t===sel?'#fff':'rgba(0,0,0,.35)';x.stroke();
  x.fillStyle='#000';x.fillText(D[t.k].e,t.x,t.y+1);
  if(t.k=='hero'){x.font='14px serif';x.fillText('👑',t.x,t.y-22);x.font='24px serif'}
  for(let i=0;i<t.lv&&t.k!='hero';i++){x.fillStyle='#ffd23f';x.fillRect(t.x-12+i*9,t.y+22,7,5)}});
 for(const b of B){x.globalAlpha=b.camo?.5:1;const c=T[b.t].c;
  if(b.t=='moab'){x.fillStyle=c;x.beginPath();x.ellipse(b.x,b.y,28,18,0,0,7);x.fill();x.fillStyle='#222';x.fillRect(b.x-22,b.y-28,44,5);x.fillStyle='#4f4';x.fillRect(b.x-22,b.y-28,44*b.hp/60,5)}
  else{x.fillStyle=c;x.beginPath();x.ellipse(b.x,b.y,9,11,0,0,7);x.fill();x.fillStyle='rgba(255,255,255,.55)';x.beginPath();x.arc(b.x-3,b.y-4,3,0,7);x.fill()}
  if(b.camo){x.strokeStyle='#3b4a2a';x.lineWidth=2;x.setLineDash([3,3]);x.beginPath();x.ellipse(b.x,b.y,b.t=='moab'?28:9,b.t=='moab'?18:11,0,0,7);x.stroke();x.setLineDash([])}
  if(b.slow>0){x.strokeStyle='#bdf';x.lineWidth=2;x.beginPath();x.arc(b.x,b.y,13,0,7);x.stroke()}
  x.globalAlpha=1}
 FX.forEach(f=>{if(f.ring){x.strokeStyle=f.col;x.lineWidth=3;x.beginPath();x.arc(f.x,f.y,f.r*(1-f.l/14),0,7);x.stroke()}
  else{x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.moveTo(f.x1,f.y1);x.lineTo(f.x2,f.y2);x.stroke()}});
 if(pl){const ok=canPlace(mx,my,pl);x.globalAlpha=.8;x.font='24px serif';x.fillText(ok?D[pl].e:'🚫',mx,my);x.globalAlpha=1}}
// ---- Platzieren & Auswählen
function canPlace(px,py,k){
 if(px<0||py<0||px>800||py>500)return false;
 if(k=='trap')return pd(px,py)<20;
 if(pd(px,py)<28)return false;
 if(ROCKS.some(r=>Math.hypot(px-r[0],py-r[1])<r[2]+16))return false;
 return !TW.some(t=>Math.hypot(px-t.x,py-t.y)<36)}
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*800/r.width,(e.clientY-r.top)*500/r.height]}
cv.addEventListener('mousemove',e=>{[mx,my]=pos(e)});
cv.addEventListener('contextmenu',e=>{e.preventDefault();pl=null});
cv.addEventListener('click',e=>{[mx,my]=pos(e);
 if(pl){const d=D[pl];
  if(money>=d.c&&canPlace(mx,my,pl)){money-=d.c;
   if(pl=='trap')TR.push({x:mx,y:my,n:14,cd:0});
   else{const t={k:pl,x:mx,y:my,cd:0,lv:0,spent:d.c,r:d.r,rate:d.rate,dmg:d.dmg,kind:d.kind,shots:d.shots||1,splash:d.splash||0,camo:d.camo||0,col:d.col};TW.push(t);sel=t}
   if(pl=='hero'||!e.shiftKey)pl=null}
  return}
 sel=TW.find(t=>Math.hypot(mx-t.x,my-t.y)<22)||null});
addEventListener('keydown',e=>{if(e.key=='Escape'){pl=null;sel=null}});
// ---- Oberfläche
const shop=$('shop');
Object.keys(D).forEach(k=>{const b=document.createElement('button');b.dataset.k=k;
 b.innerHTML='<b>'+D[k].e+' '+D[k].n+'</b><span>$'+D[k].c+'</span>';
 b.onclick=()=>{pl=pl==k?null:k;sel=null};shop.appendChild(b)});
$('go').onclick=startRound;
$('sp').onclick=()=>{spd=spd%3+1;$('sp').textContent='Tempo ×'+spd};
$('ab').onclick=()=>{if(abCd>0||!TW.some(t=>t.k=='hero'))return;abCd=2400;B.slice().forEach(b=>hit(b,2,'sharp'));FX.push({ring:1,x:400,y:250,r:420,l:14,col:'#ffd23f'})};
let pk='';
function ui(){
 $('hl').textContent='❤️ '+lives;$('hm').textContent='💰 '+money;
 $('hr').textContent='Runde '+Math.min(round,999)+(won?'':' / '+WIN);
 const go=$('go');go.disabled=running||over;go.textContent=running?'Runde läuft …':'Runde '+round+' starten';
 const hasH=TW.some(t=>t.k=='hero');
 shop.querySelectorAll('button').forEach(b=>{const k=b.dataset.k;b.disabled=money<D[k].c||(k=='hero'&&hasH);b.classList.toggle('on',pl==k)});
 const ab=$('ab');ab.disabled=!hasH||abCd>0;ab.textContent=!hasH?'Pfeilsturm (Held nötig)':abCd>0?'Pfeilsturm lädt … '+Math.ceil(abCd/60)+' s':'Pfeilsturm (Held)';
 const t=sel,nx=t&&D[t.k].up[t.lv],key=t?[TW.indexOf(t),t.lv,nx&&money>=nx[1],t.k=='hero'&&heroLv()].join():'-';
 if(key!=pk){pk=key;const p=$('pan');
  if(!t){p.innerHTML='<h3>Auswahl</h3><p class="hint">Klicke einen Affen auf dem Feld, um ihn aufzuwerten.</p>';return}
  p.innerHTML='<h3>'+D[t.k].e+' '+D[t.k].n+'</h3>'+(t.k=='hero'?'<p class="hint">Stufe '+heroLv()+' von 20. Steigt mit jeder Runde automatisch auf, sieht Tarnballons.</p>':'');
  if(nx){const b=document.createElement('button');b.disabled=money<nx[1];b.innerHTML='<span>'+nx[0]+'</span><b>$'+nx[1]+'</b>';
   b.onclick=()=>{if(money>=nx[1]){money-=nx[1];t.spent+=nx[1];nx[2](t);t.lv++;pk=''}};p.appendChild(b)}
  else if(t.k!='hero'){p.insertAdjacentHTML('beforeend','<p class="hint">Voll ausgebaut.</p>')}
  const s=document.createElement('button');s.innerHTML='<span>Verkaufen</span><b>$'+Math.floor(t.spent*.7)+'</b>';
  s.onclick=()=>{money+=Math.floor(t.spent*.7);TW=TW.filter(o=>o!==t);sel=null;pk=''};p.appendChild(s)}}
reset();
(function loop(){if(!over)for(let i=0;i<spd;i++)tick();draw();ui();requestAnimationFrame(loop)})();
</script>
</body></html>
